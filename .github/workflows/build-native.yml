name: Build and release APO.TIMIMO installers

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  native-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: windows-2022
            variant: Windows_x64
          - host: ubuntu-22.04
            variant: Linux_x64
          - host: macos-15
            variant: macOS_arm64
          - host: macos-15-intel
            variant: macOS_x64
    runs-on: ${{ matrix.host }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install --upgrade "pyinstaller>=6.12,<7" "reportlab>=4,<5" "pillow>=10,<13"
      - name: Install Inno Setup (Windows only)
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Build standalone app and run headless smoke tests
        run: python scripts/build_release.py
      - name: Create installer
        run: python scripts/package_installers.py
      - name: Verify installer outputs
        run: python scripts/verify_installers.py
      - name: Upload installers and portable apps
        uses: actions/upload-artifact@v4
        with:
          name: APO_TIMIMO_${{ matrix.variant }}
          path: releases/*
          if-no-files-found: error
          retention-days: 90

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: native-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform binaries and installers
        uses: actions/download-artifact@v4
        with:
          pattern: APO_TIMIMO_*
          path: release-files
          merge-multiple: true
      - name: Publish GitHub Release v0.1.2
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -f release-files/APO_TIMIMO_v0.1.2_Windows_x64_Setup.exe
          test -f release-files/APO_TIMIMO_v0.1.2_macOS_arm64.dmg
          test -f release-files/APO_TIMIMO_v0.1.2_macOS_x64.dmg
          test -f release-files/APO_TIMIMO_v0.1.2_Linux_amd64.deb
          gh release create v0.1.2 release-files/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "АПО.ТИМИМО v0.1.2 — установщики" \
            --notes "Установочные файлы АПО.ТИМИМО для Windows (Setup.exe), macOS Apple Silicon/Intel (DMG) и Linux Debian/Ubuntu (DEB). Также доступны переносимые приложения. Разработка команды КАИРО, Иващенко Сергей Сергеевич. Приложения не имеют цифровой подписи разработчика."
